<!doctype html>
<title>X1/X2 button event tester</title>
<a id=link href="?step2">First, click this link to get history.</a>
<p id=instructions></p>
<p id=error style="color:red;font-weight:bold;"></p>
<script>
'use strict';
let step = 'click-step2';
let preventDefault = false;
if (location.search !== '?step1') {
  location.search = '?step1';
}
let events = [];
for (let type of ['mousedown', 'mouseup', 'auxclick']) {
  addEventListener(type, e => {
    if (preventDefault && type === 'mouseup') {
      e.preventDefault();
    }
    events.push(e);
  });
}
function checkEvents(button) {
  const types = events.map(e => e.type).join();
  if (types !== 'mousedown,mouseup,auxclick') {
    error.textContent = `unexpected types ${types} (should be mousedown,mouseup,auxclick)`;
    return false;
  }
  for (let event of events) {
    if (event.button !== button) {
      error.textContent = `unexpected button ${event.button} (should be ${button})`;
      return false;
    }
  }
  events = [];
  return true;
}

addEventListener('auxclick', () => {
  const {search} = location;
  if (step === 'x1-pd') {
    if (search !== '?step2') {
      error.textContent = 'unexpected navigation to ' + location.href;
      return;
    }
    if (!checkEvents(3)) return;
    instructions.textContent = 'Now click the X1 button again (no preventDefault)';
    preventDefault = false;
    step = 'x1';
    return;
  }
  if (step === 'x2-pd') {
    if (search !== '?step1') {
      error.textContent = 'unexpected navigation to ' + location.href;
      return;
    }
    if (!checkEvents(4)) return;
    instructions.textContent = 'Now click the X2 button again (no preventDefault)';
    preventDefault = false;
    step = 'x2';
    return;
  }
});

navigation.onnavigate = async e=>{
  e.intercept();
  if (error.firstChild) {
    return;
  }
  const {url} = e.destination;
  const {search} = new URL(url);
  if (step === 'x1') {
    if (search !== '?step1') {
      error.textContent = 'unexpected navigation to ' + url;
      return;
    }
    if (!checkEvents(3)) return;
    instructions.textContent = 'Now click the X2 button (preventDefault)';
    preventDefault = true;
    step = 'x2-pd';
    return;
  }
  if (step === 'x2') {
    if (search !== '?step2') {
      error.textContent = 'unexpected navigation to ' + url;
      return;
    }
    if (!checkEvents(4)) return;
    instructions.textContent = 'All tests passed!';
    step = 'done';
    return;
  }
  if (step !== 'click-step2') return;

  switch (search) {
  case '?step2':
    link.remove();
    step = 'x1-pd';
    events = [];
    instructions.textContent = 'Now click the X1 button (preventDefault)';
    preventDefault = true;
    break;
  }
}
</script>
